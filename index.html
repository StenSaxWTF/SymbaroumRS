<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Symbaroum Rollpersoner</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#171512">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Symbaroum">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alegreya+SC:wght@500;700&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
<style>
/* Layout: one-column phone app, sticky top bar + bottom tab bar; sheets slide up for pickers and details. Single dark theme ("Davokar at dusk"). */
:root{
  --bg:#171512; --panel:#211e19; --panel-2:#2a2620; --line:#3b352c;
  --text:#ebe3d2; --muted:#a59a85; --accent:#c0614a; --accent-ink:#1b1410;
  --good:#8fa776; --bad:#e07a68;
  --display:"Alegreya SC", "Palatino Linotype", Georgia, serif;
  --body:"Alegreya Sans", "Segoe UI", system-ui, sans-serif;
  --r:10px;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{position:fixed;inset:0;width:100%}
main,.sheet-body{overscroll-behavior:contain}
body{background:var(--bg);color:var(--text);font:16px/1.45 var(--body);-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:500;margin:0;text-wrap:balance;letter-spacing:.01em}
.app{display:flex;flex-direction:column;height:100%;max-width:760px;margin:0 auto}
header.top{display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;border-bottom:1px solid var(--line);background:var(--bg);position:sticky;top:0;z-index:5}
header.top h1{font-size:1.25rem;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.back{background:none;border:0;font-size:1.4rem;line-height:1;padding:4px 8px 4px 0;color:var(--muted)}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;flex:none}
.lang button{background:none;border:0;padding:5px 11px;font-size:.85rem;font-weight:700;color:var(--muted)}
.lang button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
main{flex:1;overflow-y:auto;padding:16px 16px 24px;-webkit-overflow-scrolling:touch}
nav.tabs{display:flex;border-top:1px solid var(--line);background:var(--panel);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{flex:1;background:none;border:0;padding:10px 4px 12px;color:var(--muted);font-size:.85rem;display:flex;flex-direction:column;align-items:center;gap:3px}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--text)}
nav.tabs button[aria-current="page"] svg{color:var(--accent)}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;align-items:center}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.btn{background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:9px 14px;font-weight:500}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.btn.ghost{background:none}
.btn.danger{color:var(--bad);border-color:#5a3029}
.btn.sm{padding:5px 10px;font-size:.88rem}
.iconbtn{background:none;border:1px solid var(--line);border-radius:8px;width:36px;height:36px;display:inline-grid;place-items:center;color:var(--muted);flex:none}
/* character list */
.charlist{display:grid;gap:10px}
.charitem{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-left:6px solid var(--c,#888);border-radius:var(--r);padding:12px 14px;text-align:left;width:100%}
.charitem h3{font-size:1.15rem}
.charitem .meta{color:var(--muted);font-size:.9rem}
.charitem .xp{margin-left:auto;text-align:right;font-variant-numeric:tabular-nums;font-size:.85rem;color:var(--muted)}
.empty{padding:28px 18px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r)}
/* character header + subtabs */
.hero{border-left:6px solid var(--c,#888);padding-left:12px}
.hero h2{font-size:1.6rem;line-height:1.15}
.subtabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.subtabs button{flex:none;background:none;border:1px solid var(--line);border-radius:999px;padding:6px 13px;color:var(--muted);font-size:.92rem}
.subtabs button[aria-pressed="true"]{border-color:var(--accent);color:var(--text);background:rgba(192,97,74,.14)}
/* library tabs */
.libtabs{display:grid;grid-template-columns:repeat(4,1fr);margin:-16px -16px 0;border-bottom:1px solid var(--line);background:var(--bg)}
.libtabs button{background:none;border:0;border-bottom:2px solid transparent;padding:11px 4px 9px;color:var(--muted);font-size:.92rem;font-weight:600}
.libtabs button[aria-pressed="true"]{color:var(--text);border-bottom-color:var(--accent)}
.libtabs .soon{display:block;font-size:.68rem;font-weight:400;letter-spacing:.02em;opacity:.8}
/* trackers */
.track{display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center}
.track .lbl{font-weight:500}
.track .val{font-variant-numeric:tabular-nums;font-size:1.25rem;font-family:var(--display)}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.stepper button{background:var(--panel-2);border:0;width:36px;height:34px;font-size:1.15rem}
.stepper span,.stepper input{min-width:42px;text-align:center;font-variant-numeric:tabular-nums;font-weight:700;background:none;border:0;width:46px}
.bar{height:8px;border-radius:999px;background:var(--panel-2);overflow:hidden;grid-column:1/-1}
.bar i{display:block;height:100%;background:var(--good);transition:width .2s}
.bar.cor i{background:#9a6fb0}
/* attributes */
.attrs{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
@media (min-width:560px){.attrs{grid-template-columns:repeat(4,1fr)}}
.attr{background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;display:flex;flex-direction:column;gap:6px}
.attr .name{font-size:.88rem;color:var(--muted)}
.excgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.excgrid button{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:5px 4px;font-size:.85rem;color:var(--text);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.excgrid button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.excgrid button[disabled]{opacity:.35;text-decoration:line-through}
.attr .xbon{vertical-align:baseline}
.xbon{font-size:.7rem;font-weight:600;color:var(--good);margin-left:3px;vertical-align:super}
.attrgrid,.dergrid{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.dergrid{grid-template-columns:repeat(5,1fr)}
@media (max-width:560px){.dergrid{grid-template-columns:repeat(3,1fr)}.dergrid>.dv:last-child{grid-column:span 2}}
.av,.dv{background:var(--panel-2);padding:7px 6px 6px;display:flex;flex-direction:column;align-items:center;gap:1px;text-align:center;position:relative;min-width:0}
.av .name,.dv .name{font-size:clamp(.62rem,2.6vw,.76rem);color:var(--muted);line-height:1.35;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.dv .name{white-space:normal}
.av .num,.dv .num{font-family:var(--display);font-size:1.45rem;line-height:1.1}
.modtag{position:absolute;top:3px;right:5px;font-size:.68rem;color:var(--accent)}
.qrow{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}
.qchip{background:rgba(192,97,74,.12);border:1px solid #6a3a32;color:var(--text);border-radius:999px;padding:2px 10px;font-size:.85rem}
.qchip.sm{font-size:.78rem;padding:1px 8px}
.linkname{background:none;border:0;padding:0;color:inherit;font:inherit;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px;text-align:left}
.kvs{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:.95rem}
.kv{display:contents}.kv>span:first-child{color:var(--muted)}
.chips.wrap{flex-wrap:wrap;overflow:visible}
.sub-h{font-family:var(--display);font-size:1rem;color:var(--muted);margin-top:2px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.tile{background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:10px}
.tile .k{font-size:.82rem;color:var(--muted)}
.tile .v{font-family:var(--display);font-size:1.6rem;font-variant-numeric:tabular-nums;line-height:1.1}
.tile .f{font-size:.78rem;color:var(--muted)}
.pill{display:inline-block;border-radius:999px;padding:1px 9px;font-size:.78rem;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.lv{border-color:var(--accent);color:var(--text)}
.pill.ok{border-color:#4f6340;color:var(--good)}
.pill.warn{border-color:#6a3a32;color:var(--bad)}
.sec-head{display:flex;align-items:center;gap:10px}
.sec-head h3{font-size:1.15rem;flex:1}
.owned{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.owned button.item{display:flex;align-items:center;gap:10px;background:var(--panel);border:0;border-bottom:1px solid var(--line);padding:11px 12px;text-align:left;width:100%}
.owned button.item:last-child{border-bottom:0}
.owned .nm{font-weight:500}
.owned .sub{font-size:.82rem;color:var(--muted)}
.owned .right{margin-left:auto;display:flex;gap:6px;align-items:center;flex:none}
/* forms */
label.f{display:flex;flex-direction:column;gap:4px;font-size:.88rem;color:var(--muted)}
input.t,select.t,textarea.t{background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:9px 10px;color:var(--text);font-size:1rem;width:100%}
textarea.t{min-height:90px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatches button{width:30px;height:30px;border-radius:50%;border:2px solid transparent}
.swatches button[aria-pressed="true"]{border-color:var(--text)}
/* sheet (modal) */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);border:1px solid var(--line);border-bottom:0;border-radius:16px 16px 0 0;width:100%;max-width:760px;max-height:92%;display:flex;flex-direction:column}
.sheet-head{display:flex;align-items:center;gap:10px;padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.sheet-head h2{font-size:1.25rem;flex:1}
.sheet-body{overflow-y:auto;padding:14px 16px calc(18px + env(safe-area-inset-bottom))}
.sheet-foot{padding:10px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.sheet-foot [data-addlv]{flex:1 1 0;padding-inline:8px;white-space:nowrap}
/* picker */
.filters{display:flex;flex-direction:column;gap:8px;padding:10px 16px;border-bottom:1px solid var(--line)}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:1px}
.chips button{flex:none;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px 11px;font-size:.86rem;color:var(--muted)}
.chips button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.chips .lab{flex:none;align-self:center;font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;padding-right:2px}
/* mouse/trackpad: no horizontal swipe, so let filter rows and sub-tabs wrap instead of hiding chips */
@media (hover:hover) and (pointer:fine){ .chips,.subtabs{flex-wrap:wrap;overflow:visible} }
/* install drawer */
details.drawer{background:var(--panel);border:1px solid var(--line);border-radius:var(--r)}
details.drawer>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:14px}
details.drawer>summary::-webkit-details-marker{display:none}
details.drawer>summary h3{flex:1}
details.drawer>summary .chev{color:var(--muted);transition:transform .2s;font-size:1.1rem}
details.drawer[open]>summary .chev{transform:rotate(90deg)}
details.drawer>summary .hint{font-size:.85rem;color:var(--muted)}
details.drawer[open]>summary .hint{visibility:hidden}
.drawer-body{padding:0 14px 14px;display:flex;flex-direction:column;gap:12px}
.plat{border-top:1px solid var(--line);padding-top:12px}
.plat h4{margin:0 0 6px;font-family:var(--display);font-weight:500;font-size:1.02rem;display:flex;gap:8px;align-items:center}
.plat ol{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:3px}
.plat .tip{margin:6px 0 0;font-size:.85rem;color:var(--muted)}
.plat kbd{font:inherit;font-weight:700;background:var(--panel-2);border:1px solid var(--line);border-radius:5px;padding:0 5px}
.results{display:flex;flex-direction:column}
.res{display:flex;align-items:center;gap:10px;background:none;border:0;border-bottom:1px solid var(--line);padding:11px 2px;text-align:left;width:100%}
.res .nm{font-weight:500}
.res .sub{font-size:.82rem;color:var(--muted)}
.res .right{margin-left:auto;flex:none}
.grouphead{font-family:var(--display);font-size:.95rem;color:var(--accent);padding:14px 2px 4px;border-bottom:1px solid var(--line)}
button.grouphead{display:flex;align-items:baseline;gap:8px;width:100%;background:none;border:0;border-bottom:1px solid var(--line);text-align:left;font-size:1.1rem}
button.grouphead .hint{margin-left:auto;font-family:var(--body);font-size:.8rem;color:var(--muted)}
.res .right.pill{white-space:normal;max-width:8.5em;text-align:center;line-height:1.25;padding:3px 9px}
.res.child{padding-left:20px;border-left:2px solid #6a3a32;margin-left:4px;width:calc(100% - 4px)}
.res .quote{font-size:.82rem;color:var(--muted);font-style:italic;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.pill.elite{border-color:#6a3a32;color:var(--accent)}
button.pill{background:rgba(192,97,74,.12);border:1px solid #6a3a32;color:var(--text);font:inherit;font-size:.8rem;cursor:pointer}
.occ .quote{font-style:italic;color:#c9c0ae;margin:0 0 12px}
.occ dl{margin:14px 0 0;display:flex;flex-direction:column;gap:10px}
.occ dt{font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:3px}
.occ dd{margin:0;line-height:1.9}
.occ dd .ln{display:block}
.occ dd.detail{line-height:inherit}
.occ .note{font-size:.85rem;color:var(--muted);border-left:3px solid var(--accent);padding:2px 0 2px 10px;margin:12px 0 0}
.btn:disabled{opacity:.45;cursor:not-allowed}
.eicon{width:1.25em;height:1.25em;display:block}
.eicon.lg{width:1.6em;height:1.6em}
.pickico{color:#d9b25f;flex:none;font-size:1.1rem}
.starbtn{font-size:1.15rem;line-height:1;color:var(--muted)}
.starbtn.on{color:#d9b25f}
.elitebar{display:flex;align-items:center;gap:10px;width:100%;background:rgba(192,97,74,.10);border:1px solid #6a3a32;border-radius:12px;padding:9px 14px;text-align:left;color:var(--text)}
.elitebar .lbl{font-family:var(--display);font-size:1.05rem;letter-spacing:.02em}
.elitebar .lbl small{font-family:var(--body);font-size:.78rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;display:block}
.elitebar .cnt{margin-left:auto;font-weight:700;font-variant-numeric:tabular-nums}
.elitebar .cnt.ok{color:#9bbf7f}
.elitebar.done{background:linear-gradient(90deg,rgba(217,178,95,.18),rgba(217,178,95,.04));border-color:#8a6d33}
.elitebar.done .lbl{color:#e3c27a;text-transform:uppercase;letter-spacing:.12em;font-size:1.15rem}
.elitebar .ico{color:#d9b25f;font-size:1.1rem}
.reqlist{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.reqlist li{display:flex;gap:10px;align-items:flex-start;line-height:1.5}
.reqlist .mk{flex:none;width:1.4em;text-align:center;font-weight:700}
.reqlist .ok{color:#9bbf7f}.reqlist .no{color:#d0705c}.reqlist .man{color:var(--muted)}
.subgh{font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:10px 2px 2px}
.charmeta{display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;margin-top:2px}
.pickchips{margin-top:6px}
.pickchips button{font-size:.8rem;padding:3px 10px}
.qchip.ref{font-size:.88rem;padding:1px 9px;margin:1px 0}
/* ability detail */
.detail p{margin:0 0 .6em;max-width:68ch}
.lvl{border-left:3px solid var(--line);padding:2px 0 2px 12px;margin:10px 0}
.lvl.on{border-left-color:var(--accent)}
.lvl h4{margin:0 0 3px;font-family:var(--display);font-weight:500;font-size:1rem;display:flex;gap:8px;align-items:center}
.cmp{display:grid;grid-template-columns:1fr;gap:4px}
.cmp .en{color:#c9c0ae;font-style:italic}
.cmp .tag{font-size:.7rem;font-weight:700;letter-spacing:.08em;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{background:none;border:0;padding:5px 11px;font-size:.85rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--panel-2);color:var(--text);font-weight:700}
.list-plain{display:flex;flex-direction:column;gap:8px}
.entry{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;display:flex;gap:10px;align-items:flex-start}
.entry .grow{flex:1;min-width:0}
.entry .nm{font-weight:500}
.entry .sub{font-size:.85rem;color:var(--muted);overflow-wrap:anywhere}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--panel-2);border:1px solid var(--line);border-radius:999px;padding:8px 16px;z-index:40;font-size:.92rem;box-shadow:0 6px 24px rgba(0,0,0,.4)}
.note-date{font-size:.78rem;color:var(--muted)}
.status{font-size:.85rem;display:flex;gap:8px;align-items:center}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.dot.ok{background:var(--good)} .dot.warn{background:#d0a14a}
.num{font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <button class="back" id="backBtn" aria-label="Tillbaka" hidden>‹</button>
    <h1 id="title">Rollpersoner</h1>
    <div class="lang" role="group" aria-label="Språk / Language">
      <button id="langSv" aria-pressed="true">SV</button><button id="langEn" aria-pressed="false">EN</button>
    </div>
  </header>
  <main id="main"><p class="muted">Laddar…</p></main>
  <nav class="tabs" id="tabs">
    <button data-nav="chars" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="3.6"/><path d="M4.5 20c1.2-4 4-6 7.5-6s6.3 2 7.5 6"/></svg><span data-t="navChars">Rollpersoner</span></button>
    <button data-nav="lib"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 4.5h5.5a2 2 0 0 1 2 2V20a2 2 0 0 0-2-2H5zM19 4.5h-5.5a2 2 0 0 0-2 2V20a2 2 0 0 1 2-2H19z"/></svg><span data-t="navLib">Bibliotek</span></button>
    <button data-nav="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M12 3v2.5M12 18.5V21M3 12h2.5M18.5 12H21M5.6 5.6l1.8 1.8M16.6 16.6l1.8 1.8M5.6 18.4l1.8-1.8M16.6 7.4l1.8-1.8"/></svg><span data-t="navSettings">Inställningar</span></button>
  </nav>
</div>
<div id="layer"></div>
<input type="file" id="fileIn" accept="application/json,.json" hidden>

<script src="config.js"></script>
<script src="vendor/supabase.js"></script>
<script>
"use strict";

const TRAD_EN={"Ordensmagi":"Wizardry","Häxkonster":"Witchcraft","Svartkonst":"Sorcery","Teurgi":"Theurgy","Symbolism":"Symbolism","Stavmagi":"Staff Magic","Trollsång":"Troll Singing"};

const SPEC_EN={"Demonolog":"Demonologist","Nekromantiker":"Necromancer","Pyromantiker":"Pyromancer","Illusionist":"Illusionist","Mentalist":"Mentalist","Inkvisitor":"Inquisitor","Själasörjare":"Confessor","Grönvävare":"Green Weaver","Blodvadare":"Blood Wader","Andebesvärjare":"Spiritualist","Andebevärjare":"Spiritualist","Stavmagiker":"Staff Mage"};

/* Exceptionellt karaktärsdrag: can be taken once per attribute; o.attr = which one, +level to that attribute */
const isExc=e=>!!e&&e.type==="ability"&&(e.sv.name==="Exceptionellt karaktärsdrag"||(e.en&&e.en.name==="Exceptional Attribute"));
function attrBonus(c){ const b={}; (c.abilities||[]).forEach(o=>{ if(o.attr&&isExc(BYID[o.ref])) b[o.attr]=(b[o.attr]||0)+(o.level||1); }); return b; }
function effAttrs(c){ const b=attrBonus(c), a={}; ATTRS.forEach(k=>a[k]=(+c.attrs[k]||0)+(b[k]||0)); return a; }
const ownedName=(e,o)=>nameOf(e)+(o&&o.attr&&isExc(e)?` (${t(o.attr)})`:"");
const COLORS=["#c0614a","#d0a14a","#8fa776","#5f9e9a","#6f86c4","#9a6fb0","#c4708f","#a59a85"];
const SECTIONS={abilities:["ability","tradition"],mystic:["power","ritual"],traits:["trait","monstrous","boon","burden"],weapons:["weapon"],armors:["armor"],gear:["gear","property"]};
const ITEM_SECS={weapons:"weapons",armors:"armors",gear:"gear"};

let lang="sv";
try{ lang=localStorage.getItem("sym.lang")||"sv"; }catch(e){}
const t=(k,v)=>{let s=STR[lang][k]??STR.sv[k]??k; if(v) for(const x in v) s=s.replace("{"+x+"}",v[x]); return s;};
const tr=x=>lang==="en"?(TRAD_EN[x]||x):x;
const ar=x=>lang==="en"?(ARCH_EN[x]||x):x;
const sp=x=>lang==="en"?(SPEC_EN[x]||x):x;
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const paras=s=>esc(s).split(/\n+/).map(p=>`<p>${p}</p>`).join("");

/* ---------- rules data ---------- */
let DATA=[], BYID={};
const L=(e,l=lang)=>e[l]||e.sv;
const nameOf=e=>L(e).name;
const hasLevels=e=>e.type!=="ritual" && !!(e.sv.novice||e.en.novice);
/* ---------- items: qualities, impeding, money ---------- */
const ITEM_TYPES=["weapon","armor","quality","gear","property"];
const isGearT=ty=>ty==="gear"||ty==="property";
const isItem=e=>ITEM_TYPES.includes(e.type);
let QIDX=null;
function qualIndex(){ if(QIDX) return QIDX; QIDX={}; DATA.forEach(e=>{ if(e.type==="quality") QIDX[e.sv.name.toLowerCase()]=e; }); return QIDX; }
function findQual(tok){
  const q=qualIndex(); let k=tok.replace(/\(.*?\)/g,"").trim().toLowerCase(); if(!k) return null;
  const tries=[k,k+"t",k.replace(/d$/,"t"),k.replace(/(ig|iv|is)$/,"$1t")];
  for(const x of tries) if(q[x]) return q[x];
  if(k.length>=5){ const hit=Object.keys(q).find(n=>n.startsWith(k.slice(0,5))); if(hit) return q[hit]; }
  return null; }
const qualTokens=str=>String(str||"").split(/,|\beller\b/).map(x=>x.trim()).filter(x=>x&&x!=="-");
const hasQual=(str,name)=>qualTokens(str).some(x=>{const q=findQual(x); return q&&q.sv.name===name;});
function qualChips(str,small){
  return qualTokens(str).map(x=>{const q=findQual(x); return q?`<button class="qchip${small?" sm":""}" data-qual="${q.id}" title="${esc(q.sv.name)}">${esc(x)}</button>`:`<span class="pill">${esc(x)}</span>`;}).join(" "); }
function calcImpede(str){
  const m=String(str||"").match(/Begränsande\s*\(\s*[−-]\s*(\d)\s*\)/); if(!m) return 0;
  let v=-(+m[1]); if(hasQual(str,"Smidigt")) v=Math.min(0,v+2); if(hasQual(str,"Otympligt")) v-=1; return v; }
const COIN={daler:100,skilling:10,"örteg":1,"örtegar":1};
function parseCost(str){ const m=String(str||"").replace(/\s(?=\d{3}\b)/g,"").match(/(\d+)\s*(daler|skilling|örtegar|örteg)/i); return m?(+m[1])*COIN[m[2].toLowerCase()]:null; }
function fmtCoins(o){ const d=Math.floor(o/100), s=Math.floor(o%100/10), r=o%10; return [d?d+" "+t("daler").toLowerCase():"",s?s+" "+t("skilling").toLowerCase():"",r?r+" "+t("ortug").toLowerCase():""].filter(Boolean).join(", ")||"0"; }
function payFor(c,cost){ const p=parseCost(cost); if(p==null) return {ok:true,amount:0};
  const m=c.money; const tot=(m.daler||0)*100+(m.skilling||0)*10+(m.ortug||0); if(tot<p) return {ok:false};
  const n=tot-p; m.daler=Math.floor(n/100); m.skilling=Math.floor(n%100/10); m.ortug=n%10; return {ok:true,amount:p}; }
function itemLine(e){ const it=e.item||{};
  if(e.type==="quality") return [t("qkind")[it.kind]||it.kind, it.applies].filter(Boolean).join(" · ");
  if(isGearT(e.type)) return [it.cat, it.cost].filter(Boolean).join(" · ");
  return [it.sub, it.dmg, it.quals&&it.quals!=="Speciell"?it.quals:"", it.cost].filter(Boolean).join(" · "); }
/* boons whose text says they can be acquired several times (max three) */
const maxRanks=e=>{ if(e._mr!==undefined) return e._mr;
  const txt=[e.sv.desc,e.sv.novice,e.en.desc,e.en.novice].join(" ");
  return e._mr=(e.type==="boon"&&/kan införskaffas flera gånger|can be acquired multiple times/i.test(txt))?3:1; };
function costOf(e,o){ if(o.free) return 0;
  if(hasLevels(e)) return [0,10,30,60][o.level||1];
  if(e.type==="boon") return 5*Math.min(maxRanks(e),o.ranks||1);
  return {ritual:10,boon:5,burden:-5,trait:0,monstrous:10}[e.type]??0; }
function groupLine(e){
  const bits=[];
  if(e.specialization) bits.push(t("onlyFor",{x:sp(e.specialization)}));
  else if(e.traditions.length && e.type!=="tradition") bits.push(e.traditions.map(tr).join(", "));
  if(e.type==="ability" && e.archetypes.length) bits.push((e.onlyArchetype?t("onlyFor",{x:e.archetypes.map(ar).join(", ")}):e.archetypes.map(ar).join(", ")));
  if(e.race) bits.push(t("race_")+": "+(lang==="en"?(RACE_EN[e.race]||e.race):e.race));
  return bits.join(" · ");
}
function bookLine(e){ return (STR[lang].books[e.book]||e.book)+(e.ref?" · "+e.ref:""); }

const S={chars:[], view:"chars", charId:null, sub:"overview", syncState:"connecting", user:null};
const sb=window.supabase.createClient(window.SYM_CONFIG.url, window.SYM_CONFIG.key, {auth:{persistSession:true,autoRefreshToken:true}});
const dirty=new Set(); const writing={}; const timers={};
const lkey=()=>"sym.chars."+(S.user?S.user.id:"anon");
function loadLocal(){ try{ const j=JSON.parse(localStorage.getItem(lkey())||"[]"); S.chars=Array.isArray(j)?j:[]; }catch(e){ S.chars=[]; } S.chars.forEach(normChar); }
function saveLocal(){ try{ localStorage.setItem(lkey(),JSON.stringify(S.chars)); }catch(e){} }
const uidGen=()=>"c"+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
function blankChar(){ return {id:uidGen(),name:"",race:"",archetype:"",occupation:"",color:COLORS[0],
  attrs:{accurate:10,cunning:10,discreet:10,persuasive:10,quick:10,resolute:10,strong:10,vigilant:10},
  mods:{toughness:0,pain:0,defense:0,corrThr:0}, damage:0, tempCorr:0, permCorr:0, xpTotal:50,
  abilities:[], weapons:[], armors:[], gear:[], money:{daler:0,skilling:0,ortug:0}, notes:[], created:Date.now(), updated:Date.now()}; }
function normChar(c){ const b=blankChar(); for(const k in b) if(c[k]===undefined) c[k]=b[k];
  for(const k of ATTRS) if(c.attrs[k]===undefined) c.attrs[k]=10; for(const k in b.mods) if(c.mods[k]===undefined) c.mods[k]=0; return c; }
function touch(c){ c.updated=Date.now(); saveLocal(); queueRemote(c); }
function queueRemote(c){ dirty.add(c.id); saveDirty(); clearTimeout(timers[c.id]); timers[c.id]=setTimeout(()=>flush(c.id),700); }
function saveDirty(){ try{ localStorage.setItem(lkey()+".dirty",JSON.stringify([...dirty])); }catch(e){} }
function loadDirty(){ try{ JSON.parse(localStorage.getItem(lkey()+".dirty")||"[]").forEach(id=>dirty.add(id)); }catch(e){} }
async function flush(id){
  if(!S.user) return;
  if(writing[id]){ timers[id]=setTimeout(()=>flush(id),400); return; }
  const c=S.chars.find(x=>x.id===id); writing[id]=true;
  try{
    const r=c? await sb.from("characters").upsert({id:c.id,user_id:S.user.id,data:c,updated_at:new Date(c.updated).toISOString()})
             : await sb.from("characters").delete().eq("id",id);
    if(r.error) throw r.error;
    dirty.delete(id); saveDirty(); setSync("synced");
  }catch(e){ setSync("offline"); timers[id]=setTimeout(()=>flush(id),15000); }
  finally{ writing[id]=false; }
}
let pulling=false;
async function pull(){
  if(!S.user||pulling) return; pulling=true;
  try{
    const r=await sb.from("characters").select("id,data,updated_at"); if(r.error) throw r.error;
    const remote={}; r.data.forEach(row=>remote[row.id]=row.data);
    const merged=[]; const seen=new Set();
    for(const id in remote){ seen.add(id); const loc=S.chars.find(c=>c.id===id);
      if(loc && (dirty.has(id) || (loc.updated||0)>(remote[id].updated||0))){ merged.push(loc); queueRemote(loc); }
      else merged.push(normChar(remote[id])); }
    // characters only in this device: upload if pending, otherwise they were deleted elsewhere
    S.chars.forEach(c=>{ if(!seen.has(c.id) && dirty.has(c.id)){ merged.push(c); queueRemote(c); } });
    [...dirty].forEach(id=>{ if(!S.chars.find(c=>c.id===id)) flush(id); });
    const before=JSON.stringify(S.chars); S.chars=merged.sort((a,b)=>(a.created||0)-(b.created||0));
    saveLocal(); setSync("synced");
    if(JSON.stringify(S.chars)!==before && !document.querySelector("#layer .scrim") && !isTyping()) render();
  }catch(e){ setSync("offline"); }
  finally{ pulling=false; }
}
/* Rules cache: IndexedDB (localStorage is too small for ~1 MB of rules). Downloaded only when rules_version() changes. */
const IDB={ db:null,
  open(){ if(this.db) return this.db; this.db=new Promise((ok,no)=>{ try{ const r=indexedDB.open("symbaroum",1);
    r.onupgradeneeded=()=>r.result.createObjectStore("kv"); r.onsuccess=()=>ok(r.result); r.onerror=()=>no(r.error); }catch(e){ no(e); } }); return this.db; },
  async get(k){ const db=await this.open(); return new Promise((ok,no)=>{ const q=db.transaction("kv").objectStore("kv").get(k); q.onsuccess=()=>ok(q.result); q.onerror=()=>no(q.error); }); },
  async set(k,v){ const db=await this.open(); return new Promise((ok,no)=>{ const tx=db.transaction("kv","readwrite"); tx.objectStore("kv").put(v,k); tx.oncomplete=()=>ok(); tx.onerror=()=>no(tx.error); }); } };
async function loadRules(){
  let cached=null;
  try{ const c=await IDB.get("rules"); if(c&&Array.isArray(c.data)) cached=c; }catch(e){}
  if(!cached){ try{ const old=JSON.parse(localStorage.getItem("sym.rules")||"null"); if(Array.isArray(old)&&old.length) cached={ver:null,data:old}; }catch(e){} }
  try{ localStorage.removeItem("sym.rules"); }catch(e){}
  if(cached&&cached.data.length){ setRules(cached.data); refreshRules(cached).catch(()=>{}); return; }
  await refreshRules(null);
}
async function refreshRules(cached){
  let ver=null; const v=await sb.rpc("rules_version"); if(!v.error) ver=v.data;
  if(cached&&ver&&cached.ver===ver) return;
  const out=[]; for(let from=0;;from+=1000){ const r=await sb.from("rules").select("data").order("id").range(from,from+999); if(r.error) throw r.error; out.push(...r.data.map(x=>x.data)); if(r.data.length<1000) break; }
  if(!out.length) return;
  setRules(out); try{ await IDB.set("rules",{ver,data:out}); }catch(e){}
  if(cached && S.user && !document.querySelector("#layer .scrim") && !isTyping()) render();
}

let NIDX=null;
const LINK_PREF={boons:["boon"],burdens:["burden"]};
const NAME_ALIAS={"Regenerera":"Regeneration","Teleportera":"Teleportering","Tankestöt":"Sinnesstöt","Häxkonst":"Häxkonster","Levande fort":"Levande fästning","Förhäxad terräng":"Förhäxande landskap","Priviligierad":"Privilegierad","Snabbeld":"Snabbskytte"};
function nameIndex(){ if(NIDX) return NIDX; const m={};
  DATA.forEach(e=>{ if(!ABIL_TYPES.includes(e.type)) return; (m[e.sv.name]=m[e.sv.name]||[]).push(e); });
  Object.entries(NAME_ALIAS).forEach(([a,n])=>{ if(m[n]&&!m[a]) m[a]=m[n]; });
  const names=Object.keys(m).sort((a,b)=>b.length-a.length).map(n=>n.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"));
  NIDX={m,re:new RegExp("(?<![\\p{L}])("+names.join("|")+")(?![\\p{L}])","gu")}; return NIDX; }
function pickRef(list,pref){ const order=pref||["ability","tradition","power","ritual","monstrous","trait","boon","burden"]; return [...list].sort((a,b)=>{const ia=order.indexOf(a.type), ib=order.indexOf(b.type); return (ia<0?99:ia)-(ib<0?99:ib);})[0]; }
function linkify(text,opt={}){ if(!text) return ""; const {m,re}=nameIndex(); let out="",last=0;
  text.replace(re,(hit,_n,off)=>{ if(opt.minLen&&hit.length<opt.minLen) return hit; const e=pickRef(m[hit],LINK_PREF[opt.field]);
    out+=esc(text.slice(last,off))+`<button class="qchip ref" data-ref="${e.id}">${esc(hit)}</button>`; last=off+hit.length; return hit; });
  return out+esc(text.slice(last)); }

/* ---------- derived values ---------- */
function derived(c){
  const a=effAttrs(c), m=c.mods; const worn=c.armors.filter(x=>x.worn);
  const imp=worn.reduce((s,x)=>s+(parseInt(String(x.impede).replace("−","-"))||0),0);
  const bal=c.weapons.filter(w=>w.inUse&&hasQual(w.quality,"Balanserat")).length;
  const tough=Math.max(a.strong,10)+(m.toughness||0);
  const sg=c.abilities.find(o=>{const e=BYID[o.ref]; return e&&e.type==="ability"&&(e.sv.name==="Stark gåva"||e.en.name==="Strong Gift");});
  const strongGift=!!(sg&&(sg.level||1)>=2);
  const spent=c.abilities.reduce((s,o)=>{const e=BYID[o.ref]; return s+(e?costOf(e,o):0);},0);
  return {tough, pain:Math.ceil(a.strong/2)+(m.pain||0), def:a.quick+imp+bal+(m.defense||0), imp, bal,
    corrThr:(strongGift?a.resolute:Math.ceil(a.resolute/2))+(m.corrThr||0), abom:strongGift?a.resolute*2:a.resolute, strongGift, spent, left:(c.xpTotal||0)-spent,
    sum:ATTRS.reduce((s,k)=>s+(+c.attrs[k]||0),0), totalCorr:(c.permCorr||0)+(c.tempCorr||0)};
}

   </div></details>`; }

  return `<div class="stack">
  <div class="card stack"><h3>${t("language")}</h3><div class="seg" role="group"><button data-act="lang" data-l="sv" aria-pressed="${lang==="sv"}">Svenska</button><button data-act="lang" data-l="en" aria-pressed="${lang==="en"}">English</button></div></div>

  ${installDrawer()}
  <div class="card stack"><h3>${t("backup")}</h3>

  <div class="card stack"><h3>${t("dataTitle")}</h3><p class="small muted" style="margin:0">${t("dataBody")}</p></div></div>`;

/* ---------- picker (used for adding and for the library) ---------- */
const P={q:"",type:"all",group:"all",book:"all",sort:"name",sec:null,tab:"abil"};
const LIB_TABS=[["abil","libAbil"],["items","libItems"],["jobs","libJobs"],["races","libRaces"]];
const ABIL_TYPES=["ability","tradition","power","ritual","trait","monstrous","boon","burden"];
function pickerTypes(sec){ return sec?SECTIONS[sec]:(P.tab==="items"?ITEM_TYPES:ABIL_TYPES); }
function itemGroups(type){ const key=isGearT(type)?"cat":type==="quality"?"kind":"sub"; const seen=[]; DATA.forEach(e=>{ if(e.type===type&&e.item&&e.item[key]&&!seen.includes(e.item[key])) seen.push(e.item[key]); }); return seen; }
function pickerHtml(sec){
  const types=pickerTypes(sec);
  const chip=(k,v,l)=>`<button data-pf="${k}" data-v="${esc(v)}" aria-pressed="${P[k]===v}">${esc(l)}</button>`;
  const libItems=!sec&&P.tab==="items";
  const showTrad=sec==="mystic"||(!sec&&!libItems&&["all","power","ritual","tradition"].includes(P.type));
  const showArch=sec==="abilities"||(!sec&&P.type==="ability");
  let groupRow="";
  if(showTrad) groupRow=`<div class="chips"><span class="lab">${t("tradition")}</span>${chip("group","all",t("all"))}${TRADS.map(x=>chip("group",x,tr(x))).join("")}</div>`;
  else if(showArch) groupRow=`<div class="chips"><span class="lab">${t("arche")}</span>${chip("group","all",t("all"))}${ARCHES.map(x=>chip("group",x,ar(x))).join("")}</div>`;
  const itemType=ITEM_SECS[sec]?(SECTIONS[sec].length>1?(P.type!=="all"?P.type:null):SECTIONS[sec][0]):(!sec&&ITEM_TYPES.includes(P.type)?P.type:null);
  if(itemType) groupRow=`<div class="chips"><span class="lab">${t(itemType==="quality"?"kind":"category")}</span>${chip("group","all",t("all"))}${itemGroups(itemType).map(x=>chip("group",x,itemType==="quality"?(t("qkind")[x]||x):x)).join("")}</div>`;
  const showBook=!ITEM_SECS[sec]&&!libItems;
  return `<div class="filters" style="margin:${sec?"0":"0 -16px"}">
    <input class="t" type="search" id="pq" placeholder="${t("search")}" value="${esc(P.q)}" aria-label="${t("search")}">
    ${types.length>1?`<div class="chips"><span class="lab">${t("typ")}</span>${chip("type","all",t("all"))}${types.map(x=>chip("type",x,STR[lang].typesP[x])).join("")}</div>`:""}
    ${groupRow}
    ${showBook?`<div class="chips"><span class="lab">${t("book")}</span>${chip("book","all",t("all"))}${["GB","SH","MK","KORT"].map(x=>chip("book",x,STR[lang].books[x])).join("")}</div>`:""}
    <div class="row small"><span class="muted" id="pcount"></span><label class="row muted" style="margin-left:auto;gap:6px">${t("sort")}
      <select class="t" id="psort" style="width:auto;padding:4px 8px">${[["name","sortName"],["group","sortGroup"],["book","sortBook"]].map(([v,l])=>`<option value="${v}" ${P.sort===v?"selected":""}>${t(l)}</option>`).join("")}</select></label></div>
  </div><div class="results" id="pres" style="${sec?"padding:0 16px":""}"></div>`;
}
function groupKey(e){
  if(e.type==="power"||e.type==="ritual"||e.type==="tradition") return e.specialization?tr(e.traditions[0])+" – "+sp(e.specialization):(e.traditions.map(tr).join(", ")||"—");
  if(e.type==="ability") return e.archetypes.length?e.archetypes.map(ar).join(", "):"—";
  if(e.item) return (isGearT(e.type)?e.item.cat:e.type==="quality"?(t("qkind")[e.item.kind]||e.item.kind):e.item.sub)||STR[lang].typesP[e.type];
  return STR[lang].typesP[e.type];
}
function filterData(sec){
  const types=pickerTypes(sec); const q=P.q.trim().toLowerCase();
  let r=DATA.filter(e=>types.includes(e.type)&&(P.type==="all"||e.type===P.type)&&(P.book==="all"||e.book===P.book));
  if(P.group!=="all") r=r.filter(e=>e.traditions.includes(P.group)||e.archetypes.includes(P.group)||(e.item&&(e.item.sub===P.group||e.item.cat===P.group||e.item.kind===P.group)));
  if(q) r=r.filter(e=>{ const a=nameOf(e).toLowerCase(); if(a.includes(q)) return true;
      const s=[e.sv,e.en].map(x=>[x.name,x.desc,x.novice,x.adept,x.master].join(" ")).join(" ").toLowerCase(); return s.includes(q); })
    .sort((a,b)=>(nameOf(b).toLowerCase().includes(q))-(nameOf(a).toLowerCase().includes(q)));
  const byName=(a,b)=>nameOf(a).localeCompare(nameOf(b),lang);
  if(!q||P.sort!=="name"){
    if(P.sort==="name") r.sort(byName);
    else if(P.sort==="group") r.sort((a,b)=>groupKey(a).localeCompare(groupKey(b),lang)||byName(a,b));
    else r.sort((a,b)=>(a.book||"ZZ").localeCompare(b.book||"ZZ")||byName(a,b));
  }
  return r;
}
function renderResults(root,sec){
  const r=filterData(sec); const c=sec?cur():null;
  root.querySelector("#pcount").textContent=t("results",{n:r.length});
  let html="", last=null;
  for(const e of r.slice(0,400)){
    if(P.sort!=="name"&&!P.q.trim()){ const g=P.sort==="group"?groupKey(e):(STR[lang].books[e.book]||STR[lang].typesP[e.type]); if(g!==last){ html+=`<div class="grouphead">${esc(g)}</div>`; last=g; } }
    const has=c&&!isItem(e)&&c.abilities.some(o=>o.ref===e.id);
    const sub=isItem(e)?`${esc(STR[lang].types[e.type])} · ${esc(itemLine(e))}`:`${esc(STR[lang].types[e.type])}${groupLine(e)?" · "+esc(groupLine(e)):""} · ${esc(bookLine(e))}`;
    html+=`<button class="res" data-act="detail" data-id="${e.id}"><div><div class="nm">${esc(nameOf(e))}</div>
      <div class="sub">${sub}</div></div>
      ${has?`<span class="right pill ok">✓</span>`:""}</button>`;
  }
  root.querySelector("#pres").innerHTML=html||`<div class="empty small" style="margin-top:12px">—</div>`;
}
function bindPicker(root,sec){
  renderResults(root,sec);
  const q=root.querySelector("#pq"); q.addEventListener("input",()=>{P.q=q.value; renderResults(root,sec);});
  root.querySelector("#psort").addEventListener("change",ev=>{P.sort=ev.target.value; renderResults(root,sec);});
  root.querySelectorAll("[data-pf]").forEach(b=>b.addEventListener("click",()=>{
    P[b.dataset.pf]=b.dataset.v; if(b.dataset.pf==="type") P.group="all";
    const html=pickerHtml(sec); const holder=root.querySelector(".pickwrap")||root; const keepQ=P.q;
    holder.innerHTML=html; P.q=keepQ; bindPicker(root,sec); }));
}
function openPicker(sec){
  P.sec=sec; P.type="all"; P.group="all"; P.q=""; P.book="all"; P.sort=(sec==="mystic"||ITEM_SECS[sec])?"group":"name";
  const title={abilities:"addAbility",mystic:"addMystic",traits:"addTrait",weapons:"pickW",armors:"pickA",gear:"pickG"}[sec];
  const custom=ITEM_SECS[sec]?`<button class="btn sm" data-custom="${sec}">+ ${t({weapons:"customW",armors:"customA",gear:"customG"}[sec])}</button>`:"";
  const el=sheet(`<div class="sheet-head"><h2>${t(title)}</h2>${custom}<button class="iconbtn" data-close aria-label="${t("close")}">✕</button></div>
    <div class="sheet-body" style="padding:0"><div class="pickwrap">${pickerHtml(sec)}</div></div>`,{tall:true});
  bindPicker(el,sec);
  el.addEventListener("click",ev=>{ const b=ev.target.closest('[data-act="detail"]'); if(b){ ITEM_SECS[sec]?openItemDetail(b.dataset.id,sec):openDetail(b.dataset.id); return; }
    const cb=ev.target.closest("[data-custom]"); if(cb){ closeAll(); customItem(cur(),cb.dataset.custom,-1); } });
}

/* ---------- races ---------- */
const BOOKS_ORDER=["GB","SH","MK"];
function racesHtml(){ const all=DATA.filter(e=>e.type==="race"); if(!all.length) return `<div class="empty" style="margin-top:16px">${t("libRacesEmpty")}</div>`;
  return `<div class="filters" style="margin:0 -16px"><input class="t" type="search" id="rq" data-libsearch="races" placeholder="${t("search")}" value="${esc(P.rq||"")}" aria-label="${t("search")}"></div><div class="results" id="libres">${racesList()}</div>`; }
function racesList(){ const all=DATA.filter(e=>e.type==="race"); const q=(P.rq||"").trim().toLowerCase(); let html="";
  BOOKS_ORDER.forEach(b=>{ const lab=STR[lang].books[b]; const list=all.filter(e=>e.book===b&&(!e.hidden||q.includes(normN(e.sv.name)))&&textHit(e,q)).sort((x,y)=>L(x).name.localeCompare(L(y).name,"sv")); if(!list.length) return;
    html+=`<div class="grouphead">${esc(lab)}</div>`+list.map(r=>{ const s=L(r);
      return `<button class="res" data-act="race" data-id="${r.id}"><div style="min-width:0"><div class="nm">${esc(s.name)}</div><div class="sub">${esc(r.ref)}</div></div></button>`; }).join(""); });
  return html||`<div class="empty">${t("noHits")}</div>`; }
function labPara(p,opt){ const m=p.match(/^([A-ZÅÄÖ][^:]{1,34}):\s(.+)$/s); if(m&&!/[.,;]/.test(m[1])) return `<p><b>${esc(m[1])}:</b> ${opt?linkify(m[2],opt):esc(m[2])}</p>`; return `<p>${opt?linkify(p,opt):esc(p)}</p>`; }
function raceHtml(r){ const s=L(r);
  return `<div class="occ"><div class="row" style="flex-wrap:wrap;gap:6px;margin-bottom:12px"><span class="pill">${esc(STR[lang].books[r.book]||r.book)}</span><span class="pill">${esc(r.ref)}</span>${lang==="en"?`<span class="pill">${t("svOnly")}</span>`:""}</div>
    <div class="detail">${(s.text||[]).map(p=>`<p>${linkify(p,{minLen:5})}</p>`).join("")}</div>
    <dl>${(s.sections||[]).map(([h,ps])=>{ const opt=/namn/i.test(h)?null:/särdrag/i.test(h)?{}:{minLen:5};
      return `<div><dt>${esc(h)}</dt><dd class="detail">${ps.map(p=>labPara(p,opt)).join("")}</dd></div>`; }).join("")}</dl></div>`; }
function openRace(id){ const r=BYID[id]; if(!r) return;
  bindRefs(sheet(`<div class="sheet-head"><h2>${esc(L(r).name)}</h2><button class="iconbtn" data-close aria-label="${t("close")}">✕</button></div><div class="sheet-body">${raceHtml(r)}</div>`,{tall:true,stack:true})); }

/* ---------- occupations & archetypes ---------- */
const ARCH_ORDER=["hunter","warrior","mystic","rogue"];
const occsOf=k=>DATA.filter(e=>e.type==="occupation"&&e.arch===k).sort((a,b)=>a.sv.name.localeCompare(b.sv.name,"sv"));
function jobsHtml(){
  const f=P.jobs||"all"; const ch=(v,l)=>`<button data-jobs="${v}" aria-pressed="${f===v}">${l}</button>`;
  const arches=ARCH_ORDER.map(k=>DATA.find(e=>e.type==="archetype"&&e.arch===k)).filter(Boolean);
  if(!arches.length) return `<div class="empty" style="margin-top:16px">${t("libJobsEmpty")}</div>`;
  return `<div class="filters" style="margin:0 -16px"><input class="t" type="search" id="jq" data-libsearch="jobs" placeholder="${t("search")}" value="${esc(P.jq||"")}" aria-label="${t("search")}"><div class="chips"><span class="lab">${t("typ")}</span>${ch("all",t("all"))}${ch("common",t("jobsCommon"))}${ch("elite",t("jobsElite"))}</div></div><div class="results" id="libres">${jobsList()}</div>`;
}
const textHit=(e,q)=>{ if(!q) return true; const s=e.sv; return [s.name,s.quote,s.sub,s.race,s.abilities,s.req,s.unique,...(s.text||[]),...(s.sections||[]).flatMap(([h,ps])=>[h,...ps])].filter(Boolean).join(" ").toLowerCase().includes(q); };
function jobsList(){ const f=P.jobs||"all"; const q=(P.jq||"").trim().toLowerCase(); let html="";
  const arches=ARCH_ORDER.map(k=>DATA.find(e=>e.type==="archetype"&&e.arch===k)).filter(Boolean);
  arches.forEach(a=>{ const list=occsOf(a.arch).filter(o=>(f==="all"||(f==="elite")===!!o.elite)&&textHit(o,q)); if(!list.length) return;
    html+=`<button class="grouphead" data-act="arch" data-id="${a.id}">${esc(L(a).name)}<span class="hint">${t("aboutArch")} ›</span></button>`;
    const shown=new Set(list.map(o=>o.id));
    const row=(o,child)=>{ const s=L(o); const par=o.parent&&BYID[o.parent];
      return `<button class="res${child?" child":""}" data-act="occ" data-id="${o.id}"><div style="min-width:0"><div class="nm">${esc(s.name)}</div>
      <div class="quote">${esc(s.quote||"")}</div><div class="sub">${esc([o.sv.sub,o.ref].filter(Boolean).join(" · "))}</div></div>
      ${o.elite?`<span class="right pill elite">${par?t("eliteFor",{x:L(par).name}):t("elite")}</span>`:""}</button>`; };
    list.forEach(o=>{ if(o.parent&&shown.has(o.parent)) return;
      html+=row(o,false); list.filter(c=>c.parent===o.id).forEach(c=>html+=row(c,true)); }); });
  return html||`<div class="empty">${t("noHits")}</div>`;
}
function fieldHtml(label,val,field){ if(!val) return "";
  const lines=val.split("\n").map(l=>{ const m=l.match(/^([^:]{2,20}):\s(.*)$/); return `<span class="ln">${m?`<b>${esc(m[1])}:</b> ${linkify(m[2],{field})}`:linkify(l,{field})}</span>`; }).join("");
  return `<div><dt>${label}</dt><dd>${lines}</dd></div>`; }
function occHtml(o){ const s=L(o); const a=DATA.find(x=>x.type==="archetype"&&x.arch===o.arch);
  return `<div class="occ"><div class="row" style="flex-wrap:wrap;gap:6px;margin-bottom:12px">
    ${a?`<button class="pill" data-arch="${a.id}">${esc(L(a).name)} ›</button>`:""}${o.parent&&BYID[o.parent]?`<button class="pill" data-occ="${o.parent}">${esc(t("eliteFor",{x:L(BYID[o.parent]).name}))} ›</button>`:o.elite?`<span class="pill elite">${t("elite")}</span>`:""}${o.sv.sub?`<span class="pill">${esc(o.sv.sub)}</span>`:""}<span class="pill">${esc(o.ref)}</span>${lang==="en"?`<span class="pill">${t("svOnly")}</span>`:""}</div>
    ${s.quote?`<p class="quote">${esc(s.quote)}</p>`:""}<div class="detail">${(s.text||[]).map(p=>`<p>${linkify(p,{minLen:5})}</p>`).join("")}</div>
    <dl>${fieldHtml(t("occRace"),s.race)}${fieldHtml(t(o.elite?"occReq":"occAbil"),o.elite?s.req:s.abilities)}${fieldHtml(t("occOther"),s.other)}${fieldHtml(t("occUnique"),s.unique)}${fieldHtml(t("occBoons"),s.boons,"boons")}${fieldHtml(t("occBurdens"),s.burdens,"burdens")}</dl>
    ${o.elite?`<p class="note">${t("eliteNote")}</p>`:""}</div>`; }
function archHtml(a){ const s=L(a); const occs=occsOf(a.arch);
  return `<div class="occ"><div class="row" style="flex-wrap:wrap;gap:6px;margin-bottom:12px"><span class="pill">${t("archetype")}</span><span class="pill">${esc(a.ref)}</span>${lang==="en"?`<span class="pill">${t("svOnly")}</span>`:""}</div>
    <div class="detail">${(s.text||[]).map(p=>`<p>${linkify(p,{minLen:5})}</p>`).join("")}</div>
    <dl>${fieldHtml(t("archAbility"),s.ability)}<p class="note" style="margin:0">${t("archNote")}</p>
    <div><dt>${t("archAbils")}</dt><dd>${(s.abilities||[]).map(([k,v])=>`<span class="ln"><b>${esc(k)}:</b> ${linkify(v)}</span>`).join("")}</dd></div>
    <div><dt>${t("archOccs")}</dt><dd>${occs.map(o=>`<button class="qchip ref" data-occ="${o.id}">${esc(L(o).name)}${o.elite?" ★":""}</button>`).join(" ")}</dd></div></dl></div>`; }
function bindRefs(el){ el.addEventListener("click",ev=>{ const r=ev.target.closest("[data-ref],[data-occ],[data-arch]"); if(!r) return;
  if(r.dataset.ref) openDetail(r.dataset.ref); else if(r.dataset.occ) openOcc(r.dataset.occ); else openArch(r.dataset.arch); }); }
function openOcc(id){ const o=BYID[id]; if(!o) return;
  bindRefs(sheet(`<div class="sheet-head"><h2>${esc(L(o).name)}</h2><button class="iconbtn" data-close aria-label="${t("close")}">✕</button></div><div class="sheet-body">${occHtml(o)}</div>`,{tall:true,stack:true})); }
function openArch(id){ const a=BYID[id]; if(!a) return;
  bindRefs(sheet(`<div class="sheet-head"><h2>${esc(L(a).name)}</h2><button class="iconbtn" data-close aria-label="${t("close")}">✕</button></div><div class="sheet-body">${archHtml(a)}</div>`,{tall:true,stack:true})); }

/* ---------- ability detail ---------- */
let detailLang=null;
function detailHtml(e,owned){
  const dl=detailLang||lang;
  const pick=(f)=>{ if(dl==="both"){ const a=e.sv[f], b=e.en[f]; if(!a&&!b) return ""; return `<div class="cmp"><span class="tag">SV</span>${paras(a||"—")}<span class="tag">EN</span><div class="en">${paras(b||"—")}</div></div>`; }
    const v=(e[dl]||e.sv)[f]; return v?paras(v):""; };
  const title=dl==="both"?`${e.sv.name} / ${e.en.name}`:L(e,dl).name;
  const levels=hasLevels(e)?[1,2,3].map(n=>{const f=["","novice","adept","master"][n]; const on=owned&&(owned.level||1)>=n;
     return `<div class="lvl ${on?"on":""}"><h4>${t(f)} ${on?`<span class="pill lv">✓</span>`:""}</h4>${pick(f)}</div>`;}).join(""):"";
  const extra=(e.sv.extra&&dl!=="en")?`<div class="lvl"><h4>${lang==="en"?"Expanded (APG)":"Utökning (SH)"}</h4>${paras(e.sv.extra)}</div>`:"";

function openDetail(id,ownedIdx){

  };

const eliteIcon=(id,cls="")=>`<svg class="eicon ${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ELITE_ICONS[id]||'<path d="M12 2.8l2.8 5.9 6.4.8-4.7 4.4 1.2 6.4L12 17.2l-5.7 3.1 1.2-6.4-4.7-4.4 6.4-.8z"/>'}</svg>`;
function splitTop(s,sep){ const out=[]; let d=0,cur=""; for(let i=0;i<s.length;i++){ const ch=s[i]; if(ch==="(") d++; if(ch===")") d--;
  if(d===0&&s.startsWith(sep,i)){ out.push(cur.trim()); cur=""; i+=sep.length-1; continue; } cur+=ch; } if(cur.trim()) out.push(cur.trim()); return out; }
function eliteCheck(c,o){
  const owned=c.abilities.map(x=>({x,e:BYID[x.ref]})).filter(y=>y.e);
  const altMatch=a=>{ const m=a.match(/^(.+?)\s*\((.+)\)$/); const name=(m?m[1]:a).trim(), sub=m?m[2].trim():null;
    const allowed=sub&&!/^valfri/i.test(sub)?sub.split(/,| eller | och /).map(x=>x.trim()).filter(Boolean):null;
    if(name==="Mystisk kraft"||name==="Ritualist"){ const ty=name==="Ritualist"?"ritual":"power"; return owned.filter(y=>y.e.type===ty&&(!allowed||allowed.includes(y.e.sv.name))); }
    return owned.filter(y=>y.e.sv.name===name); };
  const items=[]; let hits=[];
  splitTop(o.sv.req||"",",").forEach(g=>{ const m=splitTop(g," eller ").flatMap(altMatch); hits=hits.concat(m); items.push({label:g,ok:m.length>0}); });
  items.push({label:t("eliteMaster"),ok:hits.some(y=>hasLevels(y.e)&&(y.x.level||1)>=3)});
  const other=(o.sv.other||"").trim();
  if(other&&!/^inga$/i.test(other)){ const k=other.match(/korruption\s*(\d+)/i);
    if(k) items.push({label:other,ok:(+c.permCorr||0)<=+k[1]});
    else if(/privilegierad/i.test(other)) items.push({label:other,ok:owned.some(y=>y.e.type==="boon"&&y.e.sv.name==="Privilegierad")});
    else items.push({label:other,manual:true}); }
  const counted=items.filter(i=>!i.manual); return {items,met:counted.filter(i=>i.ok).length,total:counted.length}; }

  let html=`<div class="results">`;

    const loose=list.filter(o=>!o.parent); const parents=[...new Set(list.filter(o=>o.parent).map(o=>o.parent))].sort((x,y)=>L(BYID[x]).name.localeCompare(L(BYID[y]).name,"sv"));

function eliteInfo(c){ const o=c.elite&&BYID[c.elite.ref]; if(!o) return; const n=L(o).name; const r=eliteCheck(c,o); const done=!!c.elite.done; const all=r.met===r.total;

  const el=sheet(`<div class="sheet-head"><h2 style="display:flex;align-items:center;gap:8px"><span style="color:#d9b25f;display:flex">${eliteIcon(o.id)}</span>${esc(done?n:t("eliteAsp",{x:n}))}</h2><button class="iconbtn" data-close aria-label="${t("close")}">✕</button></div><div class="sheet-body" data-eliteinfo>${body}</div><div class="sheet-foot">${foot}</div>`,{tall:true,stack:true});

    else if(id==="einit"&&all){ c.elite.done=true; touch(c); closeAll(); render(); toast(t("eliteDoneMsg",{x:c.name||n})); }
    else if(id==="eundo"){ c.elite.done=false; touch(c); closeAll(); render(); } }); }

const RACE_ALIAS={"barbarättad människa":"Barbar","barbarättad":"Barbar","barbarer":"Barbar","ambrisk människa":"Ambrier","ambrisk":"Ambrier"};

const matchOcc=s=>{ const n=normN(s); return n?DATA.find(e=>e.type==="occupation"&&!e.elite&&(normN(e.sv.name)===n||normN(L(e).name)===n)):null; };

    a.href=URL.createObjectURL(blob); a.download="symbaroum-rollpersoner-"+new Date().toISOString().slice(0,10)+".json";

function importText(txt){

    let n=0; list.forEach(c=>{ if(!c||typeof c!=="object") return; normChar(c); const i=S.chars.findIndex(x=>x.id===c.id); if(i>=0) S.chars[i]=c; else S.chars.push(c); touch(c); n++; });

  catch(e){ toast(t("importBad")); }

if("serviceWorker" in navigator) window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));
