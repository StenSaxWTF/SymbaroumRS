# Free Supabase projects pause after about a week without database activity.
# This job makes one tiny database call every three days so the app stays awake.
name: Keep Supabase awake
on:
  schedule:
    - cron: "17 5 */3 * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Call keepalive()
        run: |
          curl -sS --fail -X POST \
            "https://kzfzywruvmzuwgwbnteh.supabase.co/rest/v1/rpc/keepalive" \
            -H "apikey: sb_publishable_bg2a2yIA8DKkpx2CDh41hA_3CQRDjR0" \
            -H "Content-Type: application/json" -d "{}"
